server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/apartment_rental_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: apartment
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: apartment_rental_secret_key_2024_very_long_secret_key
  expiration: 86400000

upload:
  path: uploads
