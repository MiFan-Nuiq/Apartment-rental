# pytest 配置文件 —— 自动化测试工程聚合配置
# 说明：在 test/automation 目录下执行 pytest 时自动加载本文件

[pytest]
# 指定测试用例的搜索目录（相对 pytest.ini 所在目录）
testpaths = testcases

# 文件名匹配规则：收集 test_ 开头的 Python 文件
python_files = test_*.py

# 函数/方法名匹配规则：只收集 test_ 开头的用例
python_functions = test_*

# 默认命令行参数：
#   -v              冗长输出（显示每条用例结果）
#   --strict-markers 未注册的 marker 直接报错，防止拼错标签导致用例被静默漏跑
#   --alluredir     指定 Allure 报告原始数据输出目录
addopts = -v --strict-markers --alluredir=./allure-results

# 注册自定义 markers（配合 --strict-markers 使用，可通过 -m 按标签选择性执行）
markers =
    smoke: 冒烟测试（核心链路快速回归：登录/房源/预约）      # 冒烟：每次提交必跑
    regression: 回归测试（边界与异常场景、数据一致性校验）    # 回归：错误密码、脏数据校验等
    api: 接口自动化测试用例（基于 requests）                 # API：接口层用例
    ui: UI 自动化测试用例（基于 Playwright）                 # UI：界面层用例
    db: 数据库校验用例（基于 pymysql 直连 MySQL）            # DB：直连数据库做数据断言
    slow: 耗时较长的用例（如端到端全链路、大数据量校验）      # SLOW：可按需排除（-m "not slow"）