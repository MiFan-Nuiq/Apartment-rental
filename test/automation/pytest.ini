# pytest 配置文件 —— 自动化测试工程聚合配置
# 说明：在 test/automation 目录下执行 pytest 时自动加载本文件

[pytest]
# 指定测试用例的搜索目录（相对 pytest.ini 所在目录）
testpaths = testcases

# 文件名匹配规则：收集 test_ 开头的 Python 文件
python_files = test_*.py

# 函数/方法名匹配规则：只收集 test_ 开头的用例
python_functions = test_*

# 默认命令行参数：
#   -v               冗长输出（显示每条用例结果）
#   --strict-markers 未注册的 marker 直接报错，防止拼错标签导致用例被静默漏跑
#   --alluredir      指定 Allure 报告原始数据输出目录
#
# 覆盖率参数（pytest-cov）：
#   --cov=apis --cov=utils --cov=pages
#       统计「测试框架自身代码」的覆盖率，共三个包：
#         - apis/  接口封装层（用例直接调用，覆盖率最高）
#         - utils/ 工具层（请求/断言/数据库工具）
#         - pages/ UI Page Object 层（仅 UI 用例 test_ui_login.py 会执行到）
#       不需要额外配置 omit：未列入 --cov 的目录根本不进统计范围：
#         - testcases/ 是用例本身（被测对象是后端，不是用例自己）
#         - data/      是 YAML 测试数据，不是可执行代码
#       同理 conftest.py（在工程根目录、不在上述三个包内）也不计入统计。
#   --cov-report=term-missing  终端报告，并列出未覆盖的行号，便于定位补测点
#   --cov-report=xml:coverage/coverage.xml   XML 报告（供 codecov 等平台消费）
#   --cov-report=html:coverage               HTML 报告（coverage/index.html，可本地打开）
#   --cov-fail-under=90
#       覆盖率门槛：总覆盖率低于 90% 时 pytest 直接失败（退出码非 0），
#       CI 的质量门禁随之不通过、阻止合并。
#       门槛依据：纳入 apis/utils/pages 三个包后的实测基线为 99%
#       （277 条语句、4 行未覆盖），留 9 个点余量，避免轻微波动就误报。
#       说明：未覆盖的 4 行都是"难以构造"的防御性分支——
#             pages/base_page.py 的 is_visible 超时异常分支、
#             utils/assert_util.py 中"响应体非合法 JSON"的兜底分支。
addopts = -v --strict-markers --alluredir=./allure-results --cov=apis --cov=utils --cov=pages --cov-config=pytest.ini --cov-report=term-missing --cov-report=xml:coverage/coverage.xml --cov-report=html:coverage --cov-fail-under=90

# 注册自定义 markers（配合 --strict-markers 使用，可通过 -m 按标签选择性执行）
markers =
    smoke: 冒烟测试（核心链路快速回归：登录/房源/预约）      # 冒烟：每次提交必跑
    regression: 回归测试（边界与异常场景、数据一致性校验）    # 回归：错误密码、脏数据校验等
    api: 接口自动化测试用例（基于 requests）                 # API：接口层用例
    ui: UI 自动化测试用例（基于 Playwright）                 # UI：界面层用例
    db: 数据库校验用例（基于 pymysql 直连 MySQL）            # DB：直连数据库做数据断言
    slow: 耗时较长的用例（如端到端全链路、大数据量校验）      # SLOW：可按需排除（-m "not slow"）

# 覆盖率运行配置（coverage.py 的 [coverage:*] 段）
# 注意 ①：coverage.py 默认只读 .coveragerc / setup.cfg / tox.ini / pyproject.toml，
#         **不会**自动读 pytest.ini；因此 addopts 里用 --cov-config=pytest.ini
#         显式把本文件指定为覆盖率配置文件，下面的 [coverage:run] 才会生效。
# 注意 ②：本段必须放在 [pytest] 段的所有配置项之后——一旦出现新的 [xxx] 段，
#         后面的键就归属新段，会破坏 pytest 自身配置
#         （例如把 markers 挤进别的段，pytest 就会报 'api' not found in `markers`）。
# data_file：把覆盖率原始数据文件 .coverage 放进 coverage/ 目录，
#            避免在工程根目录留下一个未跟踪的散落文件；
#            coverage/ 内的 .gitignore 由 coverage 自己生成，无需改仓库根 .gitignore。
[coverage:run]
data_file = coverage/.coverage