# pytest 配置文件 —— 自动化测试工程聚合配置
# 说明：在 test/automation 目录下执行 pytest 时自动加载本文件

[pytest]
# 指定测试用例的搜索目录（相对 pytest.ini 所在目录）
testpaths = testcases

# 文件名匹配规则：收集 test_ 开头或 _test 结尾的 Python 文件
python_files = test_*.py

# 函数/方法名匹配规则：只收集 test_ 开头的用例
python_functions = test_*

# 默认命令行参数：冗长输出 + Allure 报告输出目录
addopts = -v --alluredir=./allure-results

# 注册自定义 markers（避免 warning），可通过 -m 按标签选择性执行
markers =
    smoke: 冒烟测试（核心链路，快速回归）      # 冒烟：登录/房源/预约主流程
    regression: 回归测试（边界与异常场景）     # 回归：错误密码、用户不存在等
    api: 接口自动化测试用例                   # API：基于 requests 的接口用例
    ui: UI 自动化测试用例                     # UI：基于 Playwright 的界面用例