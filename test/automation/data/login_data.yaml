# 登录接口数据驱动用例集
# 说明：由 testcases/test_login_ddt.py 读取，用于 @pytest.mark.parametrize 参数化。
# 字段含义：
#   id               用例唯一标识（作为 parametrize 的用例 id 显示）
#   title            中文用例标题（写入 Allure 报告）
#   username         登录用户名
#   password         登录密码
#   expected_code    期望的业务返回码（后端 ApiResponse.code：成功 200 / 失败 500）
#   expected_message 期望的业务提示文案（对应 AuthController 返回的 message）
#   expect_token     是否期望返回 token（True=应返回且非空；False=不应返回）
# 注意：后端 HTTP 状态码恒为 200，业务结果通过 body 中的 code/message 区分。

cases:
  - id: login_success
    title: 正常登录：账号密码正确，返回 token 与用户信息
    username: tenant
    password: "123456"
    expected_code: 200
    expected_message: 登录成功
    expect_token: true

  - id: login_wrong_password
    title: 异常登录：密码错误，返回业务提示且不返回 token
    username: tenant
    password: wrong-pwd
    expected_code: 500
    expected_message: 用户名或密码错误
    expect_token: false

  - id: login_non_exist_user
    title: 异常登录：用户不存在，返回业务提示且不返回 token
    username: no_such_user
    password: "123456"
    expected_code: 500
    expected_message: 用户不存在
    expect_token: false